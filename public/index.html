<!-- ADD LEAD FORM MODAL -->
<div class="modal fade" id="addLeadModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header bg-primary text-white">
        <h5 class="modal-title">Add New Lead</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <form id="addLeadForm">
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label">Applicant Name *</label>
              <input type="text" id="leadApplicantName" class="form-control" required>
            </div>
            <div class="col-md-6">
              <label class="form-label">Phone Number *</label>
              <input type="text" id="leadPhone" class="form-control" required>
            </div>
            <div class="col-md-4">
              <label class="form-label">City</label>
              <input type="text" id="leadCity" class="form-control">
            </div>
            <div class="col-md-4">
              <label class="form-label">Loan Product</label>
              <select id="leadLoanProduct" class="form-select">
                <option value="Personal Loan">Personal Loan</option>
                <option value="Business Loan">Business Loan</option>
                <option value="Home Loan">Home Loan</option>
              </select>
            </div>
            <div class="col-md-4">
              <label class="form-label">Requested Amount</label>
              <input type="number" id="leadRequestedAmount" class="form-control" value="0">
            </div>
            <div class="col-md-4">
              <label class="form-label">Monthly Income</label>
              <input type="number" id="leadMonthlyIncome" class="form-control" value="0">
            </div>
            <div class="col-md-4">
              <label class="form-label">Existing EMI</label>
              <input type="number" id="leadExistingEmi" class="form-control" value="0">
            </div>
            <div class="col-md-4">
              <label class="form-label">Bouncing Count</label>
              <input type="number" id="leadBouncingCount" class="form-control" value="0">
            </div>
            <div class="col-md-6">
              <label class="form-label">DSA Code</label>
              <input type="text" id="leadDsaCode" class="form-control" value="DIRECT">
            </div>
          </div>
          <div class="mt-4 text-end">
            <button type="submit" class="btn btn-primary">Save Lead & Evaluate CAM</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>

<!-- ADD BANK CONFIG MODAL -->
<div class="modal fade" id="addBankModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header bg-dark text-white">
        <h5 class="modal-title">Add / Edit Bank Configuration</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <form id="addBankForm">
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label">Bank Name *</label>
              <input type="text" id="bankName" class="form-control" required>
            </div>
            <div class="col-md-6">
              <label class="form-label">Bank Code</label>
              <input type="text" id="bankCode" class="form-control" placeholder="HDFC, ICICI, etc.">
            </div>
            <div class="col-md-4">
              <label class="form-label">Min Salary (₹)</label>
              <input type="number" id="bankMinSalary" class="form-control" value="15000">
            </div>
            <div class="col-md-4">
              <label class="form-label">FOIR Limit (%)</label>
              <input type="number" id="bankFoirPercent" class="form-control" value="50">
            </div>
            <div class="col-md-4">
              <label class="form-label">Min CIBIL</label>
              <input type="number" id="bankMinCibil" class="form-control" value="650">
            </div>
            <div class="col-md-4">
              <label class="form-label">Payout Commission (%)</label>
              <input type="number" step="0.1" id="bankPayoutPercent" class="form-control" value="1.5">
            </div>
          </div>
          <div class="mt-4 text-end">
            <button type="submit" class="btn btn-success">Save Bank Criteria</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
