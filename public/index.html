<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DSA SaaS Engine</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light p-4">

<div class="container">
    <h2 class="mb-4 text-primary fw-bold">DSA SaaS Engine - Master Control</h2>

    <!-- 1. ADD SINGLE LEAD / CALLING DATA -->
    <div class="card shadow-sm mb-4">
        <div class="card-header bg-primary text-white fw-bold">📞 Add Calling Data / Single Lead</div>
        <div class="card-body">
            <form id="addLeadForm" class="row g-3">
                <div class="col-md-3">
                    <input type="text" id="leadName" class="form-control" placeholder="Full Name" required>
                </div>
                <div class="col-md-3">
                    <input type="text" id="leadPhone" class="form-control" placeholder="Phone Number" required>
                </div>
                <div class="col-md-3">
                    <select id="leadType" class="form-select">
                        <option value="Personal Loan">Personal Loan</option>
                        <option value="Home Loan">Home Loan</option>
                        <option value="Business Loan">Business Loan</option>
                        <option value="LAP">LAP</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <button type="submit" class="btn btn-success w-100">➕ Add Lead</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 2. ADD SALES MANAGER (SM) DIRECTORY -->
    <div class="card shadow-sm mb-4">
        <div class="card-header bg-dark text-white fw-bold">👔 Add Sales Manager (SM) Entry</div>
        <div class="card-body">
            <form id="addSmForm" class="row g-3">
                <div class="col-md-2">
                    <input type="text" id="smState" class="form-control" placeholder="State" required>
                </div>
                <div class="col-md-2">
                    <input type="text" id="smCity" class="form-control" placeholder="City" required>
                </div>
                <div class="col-md-2">
                    <input type="text" id="smName" class="form-control" placeholder="SM Name" required>
                </div>
                <div class="col-md-2">
                    <input type="text" id="smMobile" class="form-control" placeholder="Mobile" required>
                </div>
                <div class="col-md-2">
                    <select id="smProduct" class="form-select">
                        <option value="HL">HL</option>
                        <option value="LAP">LAP</option>
                        <option value="PL">PL</option>
                        <option value="BL">BL</option>
                        <option value="All">All Products</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <button type="submit" class="btn btn-dark w-100">➕ Save SM</button>
                </div>
            </form>
        </div>
    </div>

    <!-- DATA DISPLAY TABLES -->
    <div class="row">
        <div class="col-md-6">
            <h4>📋 Calling / Lead Master List</h4>
            <ul id="leadList" class="list-group mb-4 shadow-sm"></ul>
        </div>
        <div class="col-md-6">
            <h4>👔 Live Sales Manager Directory</h4>
            <ul id="smList" class="list-group mb-4 shadow-sm"></ul>
        </div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
