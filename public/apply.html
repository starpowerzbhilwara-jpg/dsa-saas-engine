<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apply Online for Instant Loan</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        body {
            background-color: #f4f7f6;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .apply-card {
            max-width: 600px;
            margin: 40px auto;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            padding: 30px;
        }
        .form-label {
            font-weight: 600;
            color: #333;
        }
        .btn-submit {
            background-color: #0d6efd;
            border: none;
            padding: 12px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 8px;
        }
        .btn-submit:hover {
            background-color: #0b5ed7;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="apply-card">
        <h3 class="text-center text-primary mb-4">
            <i class="bi bi-rocket-takeoff-fill me-2"></i>Instant Loan Portal
        </h3>
        <p class="text-center text-muted mb-4">Fill out your details to check eligible banks & apply online within minutes.</p>

        <form id="customerApplyForm">
            <!-- DSA Partner Code -->
            <div class="mb-3">
                <label for="custDsaCode" class="form-label"><i class="bi bi-person-badge me-1"></i>DSA Partner Code (Optional)</label>
                <input type="text" class="form-control" id="custDsaCode" placeholder="e.g. dsa01">
            </div>

            <!-- Full Name & Mobile Number -->
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="custName" class="form-label">Full Name *</label>
                    <input type="text" class="form-control" id="custName" placeholder="Enter Full Name" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label for="custPhone" class="form-label">Mobile Number *</label>
                    <input type="tel" class="form-control" id="custPhone" placeholder="10-digit number" pattern="[0-9]{10}" required>
                </div>
            </div>

            <!-- City & Loan Product -->
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="custCity" class="form-label">City / Location *</label>
                    <input type="text" class="form-control" id="custCity" placeholder="City Name" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label for="custProduct" class="form-label">Loan Product *</label>
                    <select class="form-select" id="custProduct" required>
                        <option value="Personal Loan (PL)">Personal Loan (PL)</option>
                        <option value="Business Loan (BL)">Business Loan (BL)</option>
                        <option value="Home Loan (HL)">Home Loan (HL)</option>
                        <option value="Loan Against Property (LAP)">Loan Against Property (LAP)</option>
                    </select>
                </div>
            </div>

            <!-- Monthly Income & Current EMIs -->
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="custIncome" class="form-label">Monthly Salary / Income (₹) *</label>
                    <input type="number" class="form-control" id="custIncome" placeholder="e.g. 45000" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label for="custEmi" class="form-label">Current Monthly EMIs (₹)</label>
                    <input type="number" class="form-control" id="custEmi" value="0">
                </div>
            </div>

            <!-- Requested Loan & Bouncing -->
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="custReqAmt" class="form-label">Requested Loan Amount (₹) *</label>
                    <input type="number" class="form-control" id="custReqAmt" placeholder="e.g. 500000" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label for="custBounce" class="form-label">Cheque Bouncing in 6 months?</label>
                    <input type="number" class="form-control" id="custBounce" value="0">
                </div>
            </div>

            <button type="submit" id="submitBtn" class="btn btn-primary w-100 btn-submit mt-3">
                <i class="bi bi-shield-check me-1"></i> Submit & Check Eligible Banks
            </button>
        </form>

        <!-- Result Section (Dynamic UI) -->
        <div id="customerResultSection" class="mt-4 d-none">
            <div id="camBanner"></div>
            <h5 class="fw-bold text-dark mt-3 mb-2"><i class="bi bi-building-check me-2"></i>Eligible Options</h5>
            <div id="customerBanksList" class="row g-3"></div>
        </div>
    </div>
</div>

<script>
// 1. Auto-fill DSA Code from URL Query Parameter (e.g. apply.html?ref=DSA101)
window.addEventListener('DOMContentLoaded', () => {
    const urlParams = new URLSearchParams(window.location.search);
    const refCode = urlParams.get('ref');
    if (refCode) {
        const dsaInput = document.getElementById('custDsaCode');
        if (dsaInput) dsaInput.value = refCode;
    }
});

// 2. Submit Event Handler
document.getElementById('customerApplyForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    
    const submitBtn = document.getElementById('submitBtn');
    if (submitBtn) {
        submitBtn.disabled = true;
        submitBtn.innerText = 'Processing Loan Eligibility...';
    }

    // JSON Payload Object (Matches Backend Expected Fields)
    const payload = {
        dsaCode: document.getElementById('custDsaCode')?.value || 'DIRECT',
        applicantName: document.getElementById('custName')?.value || '',
        phone: document.getElementById('custPhone')?.value || '',
        city: document.getElementById('custCity')?.value || '',
        loanProduct: document.getElementById('custProduct')?.value || '',
        monthlyIncome: document.getElementById('custIncome')?.value || 0,
        existingEmi: document.getElementById('custEmi')?.value || 0,
        bouncingCount: document.getElementById('custBounce')?.value || 0,
        requestedAmount: document.getElementById('custReqAmt')?.value || 0
    };

    try {
        // Send JSON data with correct '/' prefixed URL
        const res = await fetch('/api/leads/file-login', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(payload)
        });

        const result = await res.json();

        if (res.ok && result.status === 'success') {
            alert('Application submitted successfully!');
            
            // If function exists to display UI result
            if (typeof renderResults === 'function') {
                renderResults(result.data);
            }
        } else {
            alert(result.message || 'Failed to submit application. Please check input data.');
        }
    } catch (err) {
        console.error('Submission Error:', err);
        alert('Server connection error. Please try again.');
    } finally {
        if (submitBtn) {
            submitBtn.disabled = false;
            submitBtn.innerText = 'Submit & Check Eligible Banks';
        }
    }
});
</script>

</body>
</html>
