<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apply as DSA Partner</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        body { background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .register-card { max-width: 500px; width: 100%; background: white; padding: 30px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        .success-box { display: none; background: #d4edda; border: 1px solid #c3e6cb; padding: 20px; border-radius: 10px; text-align: center; }
    </style>
</head>
<body>

<div class="register-card" id="registerCard">
    <div class="text-center mb-4">
        <h2 class="fw-bold text-primary"><i class="bi bi-briefcase-fill"></i> Join as DSA Partner</h2>
        <p class="text-muted small">Fill this form to get your Unique DSA Code instantly!</p>
    </div>

    <form id="publicRegisterForm">
        <div class="mb-3">
            <label class="form-label fw-bold">Full Name</label>
            <input type="text" id="regName" class="form-control" placeholder="Enter full name" required>
        </div>
        <div class="mb-3">
            <label class="form-label fw-bold">Mobile Number</label>
            <input type="text" id="regPhone" class="form-control" placeholder="10-digit mobile number" required>
        </div>
        <div class="mb-3">
            <label class="form-label fw-bold">City / Location</label>
            <input type="text" id="regCity" class="form-control" placeholder="Where are you located?" required>
        </div>
        <div class="mb-3">
            <label class="form-label fw-bold">Email ID</label>
            <input type="email" id="regEmail" class="form-control" placeholder="Enter your email" required>
        </div>
        <div class="mb-4">
            <label class="form-label fw-bold">Password</label>
            <input type="password" id="regPass" class="form-control" placeholder="Create password" required>
        </div>
        <button type="submit" class="btn btn-primary w-100 py-2 fw-bold fs-5" id="submitBtn">
            <i class="bi bi-person-plus-fill"></i> Register as DSA
        </button>
    </form>
</div>

<div class="register-card success-box" id="successBox">
    <i class="bi bi-check-circle-fill text-success" style="font-size: 3rem;"></i>
    <h3 class="fw-bold text-dark mt-2">Registration Successful!</h3>
    
    <div class="bg-white p-3 border rounded mt-3 shadow-sm">
        <h6 class="text-muted mb-1">YOUR UNIQUE DSA CODE</h6>
        <h2 class="text-primary fw-bold mb-0" id="displayDsaCode">DSA000</h2>
    </div>

    <div class="mt-3 text-start bg-light p-3 rounded border">
        <label class="fw-bold small text-dark">Share your Customer Loan Apply Link:</label>
        <input type="text" id="dsaShareLink" class="form-control form-control-sm bg-white mt-1" readonly>
    </div>
</div>

<script>
document.getElementById('publicRegisterForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('submitBtn');
    btn.disabled = true;

    const payload = {
        name: document.getElementById('regName').value,
        phone: document.getElementById('regPhone').value,
        city: document.getElementById('regCity').value,
        email: document.getElementById('regEmail').value,
        password: document.getElementById('regPass').value,
        role: 'DSA'
    };

    try {
        const res = await fetch('/api/users/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });

        const result = await res.json();
        
        if (result.status === 'success') {
            document.getElementById('registerCard').style.display = 'none';
            document.getElementById('successBox').style.display = 'block';
            
            const code = result.data.dsaCode;
            document.getElementById('displayDsaCode').innerText = code;
            
            // Generate Referral Link
            const shareUrl = `${window.location.origin}/apply.html?ref=${code}`;
            document.getElementById('dsaShareLink').value = shareUrl;
        } else {
            alert('Registration Failed: ' + result.message);
            btn.disabled = false;
        }
    } catch (err) {
        alert('Server Error. Please try again.');
        btn.disabled = false;
    }
});
</script>

</body>
</html>
